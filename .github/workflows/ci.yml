name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: uv を導入する
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 依存を解決してインストールする
        run: uv sync --extra dev --python ${{ matrix.python }}

      - name: テストを走らせる
        run: uv run --python ${{ matrix.python }} pytest -v

      # 受講者は日本語のグラフを描く。フォントが入らない環境で
      # 黙って豆腐になるのを防ぐため、CI で読めていることを確かめる。
      - name: 日本語フォントが有効か確かめる
        run: |
          uv run --python ${{ matrix.python }} python -c "
          import matplotlib; matplotlib.use('Agg')
          import matplotlib_fontja, matplotlib.pyplot as plt
          fam = plt.rcParams['font.family']
          print('font.family =', fam)
          assert fam and fam[0] != 'sans-serif', '日本語フォントが適用されていない'
          "

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .

  build:
    name: パッケージが組み立てられるか
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      # 組み立てた wheel だけを入れて、辞書が同梱されているかを確かめる。
      # src レイアウトなので、同梱漏れはこの手順でしか出ない。
      - name: wheel から辞書を読めるか
        run: |
          uv venv /tmp/wheeltest
          VIRTUAL_ENV=/tmp/wheeltest uv pip install dist/*.whl
          cd /tmp && VIRTUAL_ENV=/tmp/wheeltest uv run --no-project python -c "
          import medprep
          d = medprep.load_dict()
          print('medprep', medprep.__version__, '/ 辞書', len(d['items']), '項目')
          assert len(d['items']) >= 80
          "
