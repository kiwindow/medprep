name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 毎週月曜 09:00 JST（= 00:00 UTC）。
    # このパッケージはライブラリなので uv.lock を追跡していない。依存は毎回新しく
    # 解決される。つまり「上流の新版で壊れた」は push が無い週にも起こりうるので、
    # 定期的に回して気づけるようにしておく。
    - cron: "0 0 * * 1"

# 公開リポジトリなので既定の権限を絞る。このワークフローは読むだけでよい。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      # astral-sh/setup-uv はリリースが immutable で、v10 のような
      # 浮動の major タグを作っていない。@v10 と書くと
      # "Unable to resolve action ... unable to find version v10" で全ジョブが落ちる。
      # 版を上げるときは https://github.com/astral-sh/setup-uv/tags で
      # 実在するタグを確かめること。
      - name: uv を導入する
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          # ライブラリなので uv.lock は追跡していない。何も指定しないと
          # キャッシュ鍵が固定され、一度作ったキャッシュが永久に無効化されない。
          cache-dependency-glob: "pyproject.toml"

      - name: 依存を解決してインストールする
        run: uv sync --extra dev --python ${{ matrix.python }}

      - name: テストを走らせる
        run: uv run --python ${{ matrix.python }} pytest -v

      # 受講者は日本語のグラフを描く。フォントが入らない環境で
      # 黙って豆腐になるのを防ぐため、CI で読めていることを確かめる。
      - name: 日本語フォントが有効か確かめる
        run: |
          uv run --python ${{ matrix.python }} python -c "
          import matplotlib; matplotlib.use('Agg')
          import matplotlib_fontja, matplotlib.pyplot as plt
          fam = plt.rcParams['font.family']
          print('font.family =', fam)
          assert fam and fam[0] != 'sans-serif', '日本語フォントが適用されていない'
          "

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv sync --extra dev
      - run: uv run ruff check .

  build:
    name: パッケージが組み立てられるか
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv build
      # 組み立てた wheel だけを入れて、辞書が同梱されているかを確かめる。
      # src レイアウトなので、同梱漏れはこの手順でしか出ない。
      - name: wheel から辞書を読めるか
        run: |
          uv venv /tmp/wheeltest
          VIRTUAL_ENV=/tmp/wheeltest uv pip install dist/*.whl
          cd /tmp && VIRTUAL_ENV=/tmp/wheeltest uv run --no-project python -c "
          import medprep
          d = medprep.load_dict()
          print('medprep', medprep.__version__, '/ 辞書', len(d['items']), '項目')
          assert len(d['items']) >= 80
          "
