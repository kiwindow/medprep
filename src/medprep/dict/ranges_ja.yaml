# medprep 医学検査項目辞書 — 初版ドラフト v1.0
# 出典元: 岩藤先生提供「検査項目一覧_ver4.txt」（70 項目）
#
# 各項目の意味
#   aliases    : 列名の表記ゆれ。medprep はこれで列を自動同定する（NFKC 正規化後に照合）
#                ★別名は全項目を通じて一意であること★ 衝突すると先に定義された項目が
#                その列を取り、別項目の許容範囲で検査されて黙って NaN 化されうる。
#                CI の tests/test_dict.py が毎回この衝突を検査する。
#   unit       : 想定単位。これ以外の単位が推定された場合は unit_variants で換算する
#   plausible  : 【生理学的にあり得ない範囲の外側】。ここを外れた値は「外れ値」ではなく
#                *入力ミス* とみなして NaN 化する。winsorize してはならない。
#                生存と両立しうる極端値まで含めた広い範囲を設定してある（除きすぎない方針）
#   reference  : 成人の基準範囲（参考表示用）。JCCLS 共用基準範囲を代表値として記載。
#                ★施設・測定法で異なるため、板橋中央総合病院の自院基準での確認が必要★
#   target     : 成人維持血液透析患者での管理目標。**開区間／閉区間を区別する**
#                （low_inclusive / high_inclusive）。「5.5 未満」は high=5.5,
#                high_inclusive=false であり、5.5 は目標範囲に含まれない。
#                source にガイドラインの版と Statement 番号を必ず書く。
#   timing_required: true の項目は採血時点（透析前/透析後）が必須（medprep.timing）
#   sex_specific: true の項目は reference が男女で異なる（male/female を併記）
#   note       : 前処理上の注意
#
# ▲ この辞書は「あり得ない値の検出」が主目的であり、基準範囲の臨床判断には使わないこと。

meta:
  version: "1.0-draft"
  source: "検査項目一覧_ver4.txt（70項目）"
  reference_source: "JCCLS 共用基準範囲を代表値として記載。自院基準での確認必須"
  targets_confirmed: "2026-09-18 岩藤先生確認済（JSDT 最新公開版に基づく）"
  formulas_confirmed: "2026-09-18 全項目の算出式が確定（nPCR・%CGR・クリアスペース率・塩分量・GNRI・TAC）"
  review_note: |
    reference（基準範囲）は自院基準での確認が必要。plausible（あり得ない範囲）は
    生理学的限界に基づくもので、施設差の影響を受けにくい。
    まず plausible だけを有効にして運用し、reference は表示のみに使うことを推奨する。
    target（管理目標）は 2026-09-18 時点の JSDT 最新公開版で確定済み。
  target_sources:
    CKD-MBD: "CKD-MBD診療ガイドライン2025年改訂版〔学会誌掲載2026年、2026年5月訂正反映〕"
    腎性貧血: "慢性腎臓病患者における腎性貧血治療のガイドライン 2015年版〔掲載2016年〕"
    血液透析処方: "維持血液透析ガイドライン：血液透析処方 2013年版〔2014年訂正反映〕"

# ============================================================ 生化学
items:

  # ---------------------------------------------------------- 背景情報
  age:
    name_ja: 年齢
    aliases: [年齢, age, Age, 歳, 年令, "年齢(歳)", AGE]
    unit: 歳
    plausible: [0, 120]
    note: 透析導入年齢と観察開始時年齢は別物。どちらかを明記すること

  height:
    name_ja: 身長
    aliases: [身長, height, Height, "身長(cm)", BH]
    # ★"HT" を別名にしない★ Ht はヘマトクリットの標準的な略号であり、
    #   身長に取られると Ht 35〜50% が「あり得ない身長」として NaN にされる。
    unit: cm
    unit_variants: {m: 100}
    plausible: [50, 220]

  weight:
    name_ja: 体重
    aliases: [体重, weight, Weight, "体重(kg)", BW, 現体重]
    unit: kg
    plausible: [15, 250]
    timing_required: true
    note: |
      ★透析前体重・透析後体重・ドライウェイトは別列にすること★
      ΔBW = 透析前体重 − 透析後体重 は spKt/V・%CGR・クリアスペース率の入力。
      透析間体重増加（次回透析前体重 − 今回透析後体重）は別項目（weight_gain）。

  DW:
    name_ja: ドライウェイト
    aliases: [ドライウェイト, DW, dry weight, 基礎体重]
    unit: kg
    plausible: [15, 250]

  BMI:
    name_ja: BMI
    aliases: [BMI, 体格指数, "BMI(kg/m2)"]
    unit: kg/m²
    plausible: [8, 70]
    reference: [18.5, 25.0]
    derived: true
    formula: "体重(kg) / 身長(m)^2"
    requires: [weight, height]

  vintage:
    name_ja: 透析歴
    aliases: [透析歴, 透析歴_月, 透析期間, vintage, "透析歴(月)", "透析歴(年)", 導入後期間]
    unit: 月
    unit_variants: {年: 12}
    plausible: [0, 700]
    note: 単位が「年」か「月」かで 12 倍違う。列名に単位が無い場合は分布で確認すること

  SBP:
    name_ja: 収縮期血圧
    aliases: [収縮期血圧, SBP, sBP, 最高血圧, "収縮期血圧(mmHg)"]
    unit: mmHg
    plausible: [40, 300]
    reference: [100, 140]
    note: 透析前・透析後・中間で全く異なる。タイミングの記録が必須

  DBP:
    name_ja: 拡張期血圧
    aliases: [拡張期血圧, DBP, dBP, 最低血圧, "拡張期血圧(mmHg)"]
    unit: mmHg
    plausible: [20, 200]
    reference: [60, 90]

  Td:
    name_ja: 透析時間
    aliases: [透析時間, Td, 治療時間, "透析時間(時間)", "透析時間(分)", "透析時間(hr)", HD時間, dialysis time]
    unit: 時間
    unit_variants: {分: 0.0166666667}
    plausible: [0.5, 24]
    note: |
      ★時間単位で保持する（4時間なら 4）。240 分をそのまま入れない★
      spKt/V・%CGR の式は Td を時間単位で受け取る。列名に「分」があれば自動換算する。

  weight_gain:
    name_ja: 透析間体重増加
    aliases: [透析間体重増加, 体重増加, IDWG, 増加量, "透析間体重増加(kg)"]
    unit: kg
    plausible: [-5, 15]
    note: |
      次回透析前体重 − 今回透析後体重。推定食塩摂取量の入力。
      機器表示の総除水量とは一致しないことがある（飲水・食事・不感蒸泄のため）。
      負値（体重減少）もありうるので plausible の下限は負にしてある。

  UF:
    name_ja: 除水量
    aliases: [除水量, "除水量(kg)", 除水量(L), UF, UFV, 総除水量, ultrafiltration]
    unit: kg
    plausible: [-2, 10]
    note: |
      透析前体重 − 透析後体重。★L と kg は 1:1 として扱う（水 1 L = 1 kg）★
      spKt/V の UF はこの値を L として入れる。ml で入れると 1000 倍になる。
      負値は前後の取り違えを疑う。

  URR:
    name_ja: 尿素除去率
    aliases: [URR, "URR(%)", 尿素除去率, urea reduction ratio]
    unit: "%"
    # ★下限をわざと広く取ってある。★ 前後が入れ替わっていると URR は大きく負になる。
    #   ここで NaN にしてしまうと「入れ替わっている」という一番大事な合図が消える。
    plausible: [-1000, 100]
    reference: [65, 100]
    note: |
      (透析前BUN − 透析後BUN) / 透析前BUN × 100。
      負値は透析後のほうが高いことを意味し、生理学的にあり得ない。前後が逆である。

  interdialytic_days:
    name_ja: 透析間隔日数
    aliases: [透析間隔日数, 透析間隔, 中何日, interdialytic days, 前回透析からの日数]
    unit: 日
    plausible: [0.5, 14]
    note: |
      中1日なら 2、中2日なら 3。推定食塩摂取量の分母。
      ★週初めの採血に 2 を使うと食塩摂取量が 1.5 倍に過大評価される★

  BUN_next_pre:
    name_ja: 次回透析前BUN
    aliases: [次回透析前BUN, 次回透析前尿素窒素, BUN_next_pre, 次回前BUN, 水曜透析前BUN, 木曜透析前BUN]
    unit: mg/dL
    plausible: [1, 300]
    note: |
      TAC-BUN 簡便式の第2入力。**週初めの透析終了後 BUN と対にする次の透析の開始前 BUN**。
      同じ透析回の透析前 BUN（BUN の pre）とは別の列である。
      透析間に BUN は上昇するので、通常は 週初め透析後BUN < 次回透析前BUN となる。
      逆転していれば取り違えを疑う（medprep.tac が自動で検出する）。

  interdialytic_hours:
    name_ja: 非透析時間 Ti
    aliases: [非透析時間, Ti, 透析間時間, interdialytic hours]
    unit: 時間
    plausible: [1, 120]
    derived: true
    formula: "Ti = 開始間隔 − Td"
    note: |
      ★Ti を開始間隔そのもの（48時間）にしない★
      開始間隔48時間・透析4時間なら Ti = 44、長い間隔72時間なら Ti = 68。
      週3回・4時間透析・間隔 48/48/72 なら Σ(Td+Ti) = 168 時間。

  V_post:
    name_ja: 透析後尿素分布容積
    aliases: [透析後尿素分布容積, V_post, 分布容積, 尿素分布容積, 総体水分量, TBW]
    unit: L
    plausible: [10, 80]
    note: |
      クリアスペース率の分母。体重そのものではなく対象溶質の分布容積。
      推定式（Watson 式等）を使った場合は、その式と時点（透析前/後）を必ず記録すること。

  M_removed:
    name_ja: 溶質除去量
    aliases: [除去量, 溶質除去量, M, 尿素窒素除去量, removed mass]
    unit: mg
    plausible: [0, 200000]
    note: |
      クリアスペース率の分子。BUN を対象にする場合は **尿素窒素の量 [mg-N]**。
      尿素の質量と尿素窒素の質量を混在させない（尿素 60 g/mol、尿素窒素 28 g/mol）。

  KtV:
    name_ja: Kt/V
    aliases: ["Kt/V", KtV, "spKt/V", "eKt/V", ktv, "spKtV"]
    unit: index
    plausible: [0.1, 5.0]
    derived: true
    formula: "Daugirdas 第2世代: −ln(R − 0.008·Td) + (4 − 3.5·R)·ΔBW/BW_post"
    requires: [BUN_pre, BUN_post, weight_pre, weight_post, Td]
    target:
      low: 1.4
      low_inclusive: true
      label: 目標
      population: 週3回・1回6時間未満の維持HD
      solute: 尿素の single-pool Kt/V
      source: "維持血液透析ガイドライン2013年 第1章"
      minimum:
        low: 1.2
        low_inclusive: true
        label: 最低確保量
    note: ★「最低確保量 1.2」と「目標 1.4 以上」を分けて扱うこと★

  # ---------------------------------------------------------- 生化学

  TG:
    name_ja: 中性脂肪
    aliases: ["中性脂肪(TG)", 中性脂肪, TG, トリグリセリド, トリグリセライド, Triglyceride, TG定量]
    unit: mg/dL
    plausible: [5, 20000]
    reference: [30, 149]
    note: 食後採血で大きく変動。透析患者では高値をとりやすい

  BUN:
    name_ja: 尿素窒素
    aliases: ["尿素窒素(BUN)", 尿素窒素, BUN, UN, 血中尿素窒素, Urea nitrogen]
    unit: mg/dL
    plausible: [1, 300]
    reference: [8, 20]
    timing_required: true
    note: |
      ★透析前と透析後で 3〜4 倍違う。採血時点が不詳の BUN からは
      URR・spKt/V・nPCR・%CGR のいずれも計算しない（medprep.timing）★

  P:
    name_ja: 無機リン
    aliases: ["無機リン(P)", 無機リン, P, IP, リン, Phosphorus, 血清リン]
    unit: mg/dL
    plausible: [0.3, 20]
    reference: [2.5, 4.5]
    timing_required: true
    target:
      low: 3.5
      low_inclusive: true       # 3.5 は含む
      high: 5.5
      high_inclusive: false     # ★5.5 は含まない★
      population: 成人維持血液透析
      source: "CKD-MBD 2025年改訂版 Statement 3.1.2"
      note: 栄養状態などを踏まえて個別化する

  Ca:
    name_ja: カルシウム
    aliases: ["カルシウム(Ca)", カルシウム, Ca, Calcium, 血清Ca]
    unit: mg/dL
    plausible: [3, 20]
    reference: [8.8, 10.1]
    timing_required: true
    note: |
      アルブミン低値では補正Ca を用いる（hd.corrected_ca が自動計算）。
      管理目標は実測Ca ではなく **補正Ca**（cCa 項目）に設定されている。

  AMY:
    name_ja: アミラーゼ
    aliases: ["アミラーゼ(AMY)", アミラーゼ, AMY, AMS, Amylase]
    unit: U/L
    plausible: [1, 10000]
    reference: [44, 132]
    note: 透析患者では腎排泄低下により基準範囲上限を超えることが多い

  T-Bil:
    name_ja: 総ビリルビン
    aliases: ["総ビリルビン(T-Bil)", 総ビリルビン, T-Bil, TBil, T.Bil, 総ﾋﾞﾘﾙﾋﾞﾝ, Total bilirubin]
    unit: mg/dL
    plausible: [0.05, 50]
    reference: [0.4, 1.5]

  TP:
    name_ja: 総蛋白
    aliases: ["総蛋白(TP)", 総蛋白, TP, 総タンパク, 総蛋白質, Total protein]
    unit: g/dL
    plausible: [1.5, 15]
    reference: [6.6, 8.1]

  Alb:
    name_ja: アルブミン
    aliases: ["アルブミン(Alb)", アルブミン, Alb, ALB, ｱﾙﾌﾞﾐﾝ, Albumin, 血清アルブミン]
    unit: g/dL
    plausible: [0.5, 7]
    reference: [4.1, 5.1]
    timing_required: true
    note: |
      栄養指標。BCG 法と BCP 改良法で 0.3 g/dL 程度系統差がある（measurement_changes 参照）。
      透析領域で「3.5 g/dL 以上」がしばしば目安とされるが、これは
      ガイドラインの管理目標値ではないため target には入れない。

  CK:
    name_ja: CK（CPK）
    aliases: ["CK(CPK)", CK, CPK, "CK (CPK)", クレアチンキナーゼ, Creatine kinase]
    unit: U/L
    plausible: [5, 200000]
    sex_specific: true
    reference_male: [59, 248]
    reference_female: [41, 153]
    note: 運動・筋注・転倒後に著明高値。横紋筋融解では 10 万を超えうるため plausible 上限は広い

  LAP:
    name_ja: ロイシンアミノペプチダーゼ
    aliases: ["ロイシンアミノペプチターゼ(LAP)", ロイシンアミノペプチダーゼ, LAP]
    unit: U/L
    plausible: [5, 1000]
    reference: [35, 73]

  GGT:
    name_ja: γ-GT（γ-GTP）
    aliases: ["γ-GT(γ-GTP)", γ-GT, γ-GTP, γGTP, gGTP, GGT, ガンマGTP, γ-グルタミルトランスフェラーゼ]
    unit: U/L
    plausible: [1, 5000]
    sex_specific: true
    reference_male: [13, 64]
    reference_female: [9, 32]

  AST:
    name_ja: AST（GOT）
    aliases: ["AST(GOT)", AST, GOT, "AST(GOT)値", ASTGOT]
    unit: U/L
    plausible: [2, 20000]
    reference: [13, 30]

  ALT:
    name_ja: ALT（GPT）
    aliases: ["ALT(GPT)", ALT, GPT, ALTGPT]
    unit: U/L
    plausible: [1, 20000]
    sex_specific: true
    reference_male: [10, 42]
    reference_female: [7, 23]
    note: 透析患者は一般に低値。基準範囲内でも肝障害を否定できない

  Cr:
    name_ja: クレアチニン
    aliases: ["クレアチニン(Cr)", クレアチニン, Cr, CRE, CREA, Creatinine, 血清クレアチニン, S-Cr]
    unit: mg/dL
    unit_variants: {µmol/L: 0.0113, umol/L: 0.0113}
    plausible: [0.05, 40]
    sex_specific: true
    reference_male: [0.65, 1.07]
    reference_female: [0.46, 0.79]
    timing_required: true
    note: |
      透析患者では 10 mg/dL 前後が普通。低値は筋肉量低下を示し予後不良因子。
      %CGR は透析前後の Cr の組を必要とする。

  UA:
    name_ja: 尿酸
    aliases: ["尿酸(UA)", 尿酸, UA, "UA(尿酸)", Uric acid]
    unit: mg/dL
    plausible: [0.2, 30]
    sex_specific: true
    reference_male: [3.7, 7.8]
    reference_female: [2.6, 5.5]

  Fe:
    name_ja: 血清鉄
    aliases: ["血清鉄(Fe)", 血清鉄, Fe, 鉄, Iron, S-Fe]
    unit: µg/dL
    plausible: [1, 1000]
    reference: [40, 188]
    note: 日内変動が大きい。TSAT の分子

  Mg:
    name_ja: マグネシウム
    aliases: ["マグネシウム(Mg)", マグネシウム, Mg, Magnesium]
    unit: mg/dL
    plausible: [0.3, 10]
    reference: [1.8, 2.4]

  ChE:
    name_ja: コリンエステラーゼ
    aliases: ["コリンエステラーゼ(ChE)", コリンエステラーゼ, ChE, CHE]
    unit: U/L
    plausible: [10, 3000]
    sex_specific: true
    reference_male: [240, 486]
    reference_female: [201, 421]

  Na:
    name_ja: ナトリウム
    aliases: ["ナトリウム(Na)", ナトリウム, Na, Sodium, 血清Na]
    unit: mEq/L
    unit_variants: {mmol/L: 1.0}
    plausible: [90, 200]
    reference: [138, 145]

  K:
    name_ja: カリウム
    aliases: ["カリウム(K)", カリウム, K, Potassium, 血清K]
    unit: mEq/L
    unit_variants: {mmol/L: 1.0}
    plausible: [1.0, 12.0]
    reference: [3.6, 4.8]
    timing_required: true
    note: |
      透析前値と透析後値で全く異なる（透析で 1〜2 mEq/L 下がる）。
      溶血検体で偽高値になるため、単発の高値は検体不良を疑う。
      「透析前 3.5〜5.5」は慣用の目安でありガイドラインの管理目標ではないため
      target には入れない。

  Cl:
    name_ja: クロール
    aliases: ["クロール(Cl)", クロール, Cl, Chloride, 血清Cl]
    unit: mEq/L
    unit_variants: {mmol/L: 1.0}
    plausible: [60, 160]
    reference: [101, 108]

  TIBC:
    name_ja: 総鉄結合能
    aliases: ["総鉄結合能(TIBC)", 総鉄結合能, TIBC]
    unit: µg/dL
    plausible: [50, 800]
    reference: [253, 365]
    note: TSAT の分母。UIBC しか無い場合は TIBC = Fe + UIBC で導出可

  LDL:
    name_ja: LDL-コレステロール
    aliases: ["LDL-コレステロール(LDL)", LDLコレステロール, LDL, LDL-C, LDLC, LDL-Cho]
    unit: mg/dL
    plausible: [5, 1000]
    reference: [65, 139]

  CEA:
    name_ja: CEA
    aliases: [CEA, 癌胎児性抗原, CEA定量]
    unit: ng/mL
    plausible: [0, 10000]
    reference: [0, 5.0]
    note: 透析患者では腎排泄低下でやや高値。喫煙で上昇

  AFP:
    name_ja: AFP
