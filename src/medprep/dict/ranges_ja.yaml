# ============================================================ 派生指標・透析指標
  GNRI:
    name_ja: GNRI（老年栄養リスク指数）
    aliases: [GNRI, 老年栄養リスク指数, Geriatric Nutritional Risk Index]
    unit: index
    plausible: [40, 140]
    derived: true
    formula: "14.89 × Alb(g/dL) + 41.7 × (体重 / 理想体重)"
    ideal_body_weight: "身長(m)² × 22（日本の透析領域で慣用）"
    requires: [Alb, weight, height]
    implemented: medprep.hd.gnri
    weight_source: "ドライウェイト優先、無ければ透析後体重（2026-09-18 確定）"
    weight_source_note: 透析前体重は使わない（体液貯留分が栄養指標に混入するため）
    cap_ratio: true          # 体重/理想体重 > 1 は 1 に丸める（原法の規約。既定）
    cutoffs: {高度リスク: "<82", 中等度リスク: "82–<92", 軽度リスク: "92–<98", リスクなし: "≥98"}
    note: |
      体重の選び方は確定済み。理想体重の定義（BMI 22 換算）と丸めの規約（cap_ratio）は
      既定としてこの値を採用しているが、施設の運用に合わせて変更できる。
      どの体重を使ったかは症例ごとにレポートへ出す。カットオフは文献により異なる。

  cCa:
    name_ja: 補正Ca
    aliases: [補正Ca, 補正カルシウム, corrected Ca, cCa, 補正Ｃａ, iCa, "iCa(mg/dL)", 補正カルシウム(iCa)]
    unit: mg/dL
    plausible: [3, 20]
    derived: true
    formula: "Payne 式: Alb < 4.0 のとき  補正Ca = 実測Ca + 4 − Alb、Alb ≥ 4.0 のとき 実測Ca"
    requires: [Ca, Alb]
    target:
      low: 8.4
      low_inclusive: true
      high: 9.5
      high_inclusive: false     # ★9.5 は含まない（2025年改訂版で 10.0 から変更）★
      population: 成人維持血液透析
      source: "CKD-MBD 2025年改訂版 Statement 3.2.1"
    note: |
      ★2025年改訂版で上限が 10.0 → 9.5 未満に変更された★。
      Payne 式は低 Alb 時にイオン化 Ca との乖離が生じるため、補正値は目安として扱う。
      Alb の測定法（BCG / BCP改良）が変わると補正Ca も系統的にずれる。

  cCaxP:
    name_ja: 補正Ca × P
    aliases: [補正Ca×P, 補正CaxP, CaxP, Ca×P, カルシウムリン積, iCa×P, iCaxP]
    unit: mg²/dL²
    plausible: [5, 300]
    derived: true
    formula: "補正Ca × P"
    requires: [cCa, P]
    note: |
      JSDT の現行ガイドラインは Ca と P を **個別に** 管理する方針であり、
      Ca×P 積に管理目標値は設定されていない。したがって target は置かない。
      研究目的で使う場合は、補正Ca と P の両方を同時にモデルに入れた場合との
      違いを示せるようにすること（Ca×P は 2 変数の積であり交互作用項に相当する）。

  TSAT:
    name_ja: トランスフェリン飽和度
    aliases: ["TSAT(%)", TSAT, トランスフェリン飽和度, Tsat, 鉄飽和度]
    unit: "%"
    plausible: [0, 100]
    reference: [20, 50]
    derived: true
    formula: "Fe / TIBC × 100"
    requires: [Fe, TIBC]
    implemented: medprep.hd.tsat
    note: 100% を超える値は入力ミス（Fe > TIBC はあり得ない）。audit が検出する

  nPCR:
    name_ja: 標準化蛋白異化率
    aliases: [nPCR, nPNA, 標準化蛋白異化率, normalized protein catabolic rate]
    unit: g/kg/day
    plausible: [0.1, 3.0]
    reference: [0.9, 1.4]
    derived: true
    formula: "nPCR = 0.0136 × Kt/V × (BUN透析前 + BUN透析後)/2 + 0.251"
    requires: [BUN_pre, BUN_post, KtV]
    source: "Kaynar K, et al. Hippokratia. 2012;16(3):236-240."
    confirmed: "2026-09-18 岩藤先生指示"
    implemented: medprep.hd.npcr
    note: |
      BUN_mean は透析前後2点の **算術平均** であり時間平均 BUN ではない。
      Kt/V には spKt/V（Daugirdas 第2世代）を用いる。
      ★簡便推算式であり、JSDT 統計調査や施設の透析管理ソフトと同一の算出法ではない。
      nPCR の算出法が異なれば %CGR の G_ext・G_int も変わる★

  pct_CGR:
    name_ja: "%クレアチニン産生速度（%CGR）"
    aliases: ["％CGR", "%CGR", CGR, クレアチニン産生速度]
    unit: "%"
    plausible: [10, 300]
    derived: true
    requires: [sex, age, BUN_pre, BUN_post, Cr_pre, Cr_post, weight_pre, weight_post, Td]
    confirmed: "2026-09-18 岩藤先生提示の11ステップ式"
    implemented: medprep.hd.percent_cgr
    verified: "提示された計算例（男性60歳）と 1e-11 以内で一致"
    source: |
      滋賀腎・透析研究会「適正HD指標の計算 Kt/V,nPCRなど」
      （spKt/V・Cr_corr・A・G_total・G_ext・G_int・G_ref）
      ＋ Kaynar 2012（nPCR 簡便式）
    applicability:
      - 通常の週3回血液透析を想定。G_total の式には 72 時間が固定値として含まれる
      - 中2日の長い透析間隔に対応する **週初めの採血** を想定する
      - 任意の透析曜日・連日透析・週2回透析にそのまま適用しない（72 を 48 に置換してよい意味ではない）
      - 尿中クレアチニン排泄の補正を含まない。残腎機能があると内因性産生を過小評価しうる
      - 透析前後の採血は同一セッションのもの
    steps: |
      1  ΔBW     = BW_pre − BW_post
      2  R       = BUN_post / BUN_pre
      3  spKt/V  = −ln(R − 0.008·Td) + (4 − 3.5·R)·ΔBW / BW_post
      4  nPCR    = 0.0136·spKt/V·(BUN_pre + BUN_post)/2 + 0.251
      5  Cr_corr = (−81.622·ln(Cr_post/Cr_pre)/(60·Td) + 0.942)·Cr_post
      6  L = ln(Cr_corr/Cr_pre)
         D = (0.019·Td + 0.999)·L − (0.00367·Td − 0.0219)
         A = 3864 + (7.8·Td + 411)·L − 1.5·Td − 1449/D
      7  G_total = Cr_pre·(7056/A + (ΔBW/BW_post)·240/(72 − Td))
      8  G_ext   = 7.79·nPCR² − 7.91·nPCR + 1.93
      9  G_int   = G_total − G_ext
      10 G_ref   = 23.53 − 0.15·age（男） / 19.58 − 0.12·age（女）
      11 %CGR    = 100·G_int / G_ref
    note: |
      100% は基準と同等の内因性産生速度を意味する。
      80% という結果は筋肉量が厳密に 80% という意味ではない。
      ★異常な入力値や負の産生速度が出ても自動で 0 に丸めない。NaN にして理由を残す★

  clearspace_AV:
    name_ja: クリアスペース率 A/V
    aliases: ["クリアスペース率A/V", クリアスペース率, クリアスペース, CSR, "A/V"]
    unit: "%"
    plausible: [0, 200]
    derived: true
    confirmed: "2026-09-18 岩藤先生提示の定義"
    implemented: medprep.hd.clear_space_ratio / clear_space_ratio_estimated
    verified: "提示された計算例（15120 mg-N, 60 mg/dL, 36 L → 70.0%）と完全一致"
    definition: |
      A = M / C_pre              1回の透析で除去された総量 M を透析前濃度で除した等価浄化容積 [L]
      A/V      = A / V           A を対象溶質の分布容積 V で標準化（無次元）
      A/V[%]   = 100 · M_mg / (10 · C_pre[mg/dL] · V_post[L])
    methods:
      実測法:
        requires: [M_mg, C_pre_mg_dL, V_post_L]
        M_from_effluent: "M[mg] = 10 · C_effluent[mg/dL] · V_effluent[L]（新鮮透析液に対象溶質なしが前提）"
        note: 分割採取の場合は区間ごとの除去量を合計する。排液の一部のみ採取した場合、採取液量を全排液量として使わない
      推算法:
        formula: "A/V[%] = 100·(V_pre/V_post − C_post/C_pre + G·t/(10·C_pre·V_post))"
        simplified: "産生を無視し ΔBW で体液量差を近似: A/V[%] = 100·(1 + ΔBW/V_post − C_post/C_pre)"
        note: ★実測値と同一視しないこと。結果名に「推定」を付ける★
    note: |
      ★A は面積ではなく容積。V は体重そのものではなく対象溶質の分布容積★
      BUN を使う場合、M も尿素窒素の除去量 [mg-N] とする。尿素と尿素窒素を混在させない。
      分母に透析後 BUN を入れない。
      透析後 V で標準化した指標は条件により 100% を超えうる。
      **出力を一律に 0〜100% へ切り詰めない。**
      G = 0 は「産生を無視する近似を採用する」という明示的な選択であり、
      産生速度が不明であることと 0 であることは同じではない。
      A/V と Kt/V は同じ指標ではない（等価なのは体液量一定・産生なし・単一プールの仮定下のみ）。
    must_record: [対象溶質, Mの取得法, Vの算出法と時点, 結果が比率か%か]

  salt:
    name_ja: 推定食塩摂取量
    aliases: [塩分量, 食塩摂取量, 推定食塩摂取量, NaCl摂取量, 推定塩分摂取量]
    unit: g/day
    plausible: [0, 30]
    derived: true
    confirmed: "2026-09-18 岩藤先生指示：透析間体重増加と Na からの推定"
    implemented: medprep.hd.salt_intake
    formula: |
      摂取Na[mEq] = 透析間体重増加[kg → L] × 血清Na[mEq/L]
      食塩[g]     = 摂取Na / 17          （1 g NaCl ≒ 17 mEq Na）
      1日あたり    = 食塩[g] / 透析間隔日数
    requires: [weight_gain, Na_pre, interdialytic_days]
    assumptions:
      - 透析間に増加した体液の Na 濃度が血清 Na 濃度に等しいとみなしている。自由水を多く摂った患者では過大評価する
      - 不感蒸泄・残腎からの Na 排泄・便中排泄を無視している
      - 透析間隔日数は中1日なら 2、中2日なら 3。週初めの採血に 2 を使うと 1.5 倍の過大評価になる
    note: |
      厳密な摂取量ではない。結果の名称に「推定」を残すこと。
      ★透析間隔日数の列があれば実日数を使う。無い場合は既定 2 とするが必ず警告を出す★

  TAC:
    name_ja: TAC-BUN（時間平均尿素窒素濃度）
    aliases: [TAC, 時間平均濃度, "TAC-BUN", TACBUN, TACurea, "TAC(urea)", 時間平均尿素窒素濃度]
    unit: mg/dL
    solute: BUN                # 尿素窒素。尿素分子全体の質量濃度とは異なる
    plausible: [0, 200]
    derived: true
    confirmed: "2026-09-18 岩藤先生提示の定義"
    implemented: medprep.tac
    verified: "簡便式の計算例（20, 60 → 40 mg/dL）および換算（40 → 尿素 85.7 mg/dL、14.3 mmol/L）と一致"
    definition: "TAC_X = (1/T)∫[0,T] C_X(t) dt = AUC_X(0,T) / T 。週間評価は T = 168 時間（透析中と非透析中の両方を含む）"
    methods:
      simple:
        formula: "TAC_BUN = (週初め透析後BUN + 次回透析開始前BUN) / 2"
        requires: [BUN_post_first, BUN_pre_second]
        example: "月・水・金透析なら (月曜透析後 + 水曜透析前) / 2"
        kind: simple
        note: 規則的な週3回血液透析における週間平均の簡便な推定値。168時間の積分による厳密値ではない
      trapezoid:
        formula: "AUC = Σ((C[i]+C[i+1])/2)·(t[i+1]−t[i]) 、TAC = AUC / (t[n]−t[0])"
        requires: [時刻の列, 濃度の列]
        kind: auc
        note: 定義に基づく数値積分。特定学会の専用推算式ではない。時刻は厳密な昇順であること
      linear:
        formula: "Σ((C_pre+C_post)/2·Td + (C_post+C_pre_next)/2·Ti) / Σ(Td+Ti)"
        requires: [BUN_pre, BUN_post, BUN_next_pre, Td, interdialytic_hours]
        kind: auc
        note: |
          Ti = 開始間隔 − Td。★Ti を 48 時間にしない★
          （開始間隔48時間・透析4時間なら Ti = 44、長い間隔72時間なら Ti = 68）。
          4時間透析3回・間隔48/48/72 なら全時間 168 時間になる（medprep が検算する）。
          C_pre[4] は翌週第1回の実測透析前濃度。週ごとの状態が同じという仮定を置く場合のみ C_pre[4] = C_pre[1] とできる。
          透析中の濃度低下は一般に直線ではないため近似値である。
    conversion:
      urea_mg_dL: "TAC_BUN × (60/28)"
      urea_mmol_L: "TAC_BUN / 2.8"
      note: 60 と 28 は尿素分子量および窒素部分の質量を丸めた値。同一の評価期間・同一の時間平均法に対してのみ成り立つ
    must_not_confuse_with:
      - "同じ透析回の「透析前BUNと透析後BUNの平均」（＝ nPCR の BUN_mean）"
      - "「週初め透析前BUNと次回透析前BUNの平均」"
    must_record: [対象物質, 結果と単位, 算出法, 入力採血日時, 透析日程, 透析後採血のタイミング／手順]
    note: |
      ★単に検査値を全部足して検査回数で割る方法は、測定間隔が異なる場合には時間平均にならない★
      簡便値（kind=simple）と AUC 由来値（kind=auc）は区別して保存する。
      欠測は 0 として扱わず算出不能（NaN）とする。負値・非数値は入力エラーとする。
      TAC-BUN は濃度の指標であり、Kt/V・除去率・nPCR と同一ではない。
      BUN は尿素除去だけでなく蛋白摂取・異化・残存腎機能にも影響されるため、
      低 TAC-BUN だけで良好な透析と判定せず、栄養状態や nPCR と併せて評価する。
      不規則な日程・週2回・頻回透析・急性病態に簡便式と同じ精度を前提にしない。
      管理目標値は設定しない（提示資料は算出方式の整理であり、ガイドライン推奨ではない）。
    source: |
      三島クリニック「透析室ニュース 第30号」2007-09-06（TAC-BUN の項、簡便法）。
      医療機関の説明資料であり日本透析医学会のガイドラインではない。
      定義式・台形則・時間加重近似・単位換算は、時間平均の数学的定義と分子量に基づく整理。

# ============================================================ 測定法の変更（時系列データでの段差）
measurement_changes:
  - item: ALP
    date: "2020-04"
    change: "JSCC 法 → IFCC 法"
    effect: "値がおよそ 1/3 になる（例: 240 U/L → 80 U/L）"
    detection: "2020年4月前後で分布に段差がある場合は換算が必要"
    action: "IFCC ≒ JSCC × 0.35 で近似換算できるが、個別値の厳密換算は不可。期間を共変量に入れるか、期間で層別すること"
  - item: LDH
    date: "2020-04"
    change: "JSCC 法 → IFCC 法"
    effect: "系統差は小さいが存在する"
  - item: HbA1c
    date: "2012-04"
    change: "JDS 値 → NGSP 値"
    effect: "NGSP = JDS × 1.02 + 0.25（約 +0.4%）"
  - item: Alb
    date: "施設により異なる"
    change: "BCG 法 → BCP 改良法"
    effect: "BCP 改良法は BCG より 0.2〜0.3 g/dL 低く出る"
    action: "低アルブミン血症の判定と補正Ca の計算に直接影響する。測定法を記録すること"

# ============================================================ 欠損コード（全項目共通）
missing_codes:
  numeric: [999, 9999, 99999, -1, -9, -99, -999, 9999999]
  text: ["", "-", "ー", "―", ".", "・", "なし", "未実施", "未測定", "検査なし", "該当なし",
         "N/A", "NA", "n/a", "#N/A", "#VALUE!", "測定不能", "検体不良", "中止", "不明", "***"]
  note: |
    数値の欠損コードは「その列の分布から浮いた離散的な値」として検出し、
    自動では NaN 化せず schema.yaml に候補として列挙して確認を求める。
    9999 が実測値でありうる項目（フェリチン、AFP、NT-proBNP）があるため、
    一律の NaN 化は危険である。

# ============================================================ 検出限界の表記
limit_of_detection:
  patterns: ["<", "＜", ">", "＞", "≦", "≧", "以下", "以上", "未満"]
  default_policy: "half"     # 'half'（1/2 LOD を代入）| 'lod'（LOD をそのまま）| 'nan' | 'keep_flag'
  note: |
    "<0.1" は 0.05 に置換し、同時に censored_low フラグ列を立てる。
    CRP、BNP、iPTH、フェリチン、AFP で頻出する。
    フラグ列を捨てると「検出限界以下だった」という情報が失われるため、既定では必ず残す。

# ============================================================ 分画の検算
composition_groups:
  白血球分画:
    members: [Neutro, Eosino, Baso, Mono, Lympho]      # ★2026-09-18 確定★
    sum_to: 100
    tolerance: 3
    confirmed: "2026-09-18 岩藤先生指示：好中球を使う"
    excluded_members: [Band, Seg]
    note: |
      好中球 = 桿状核球 + 分葉核球 なので、7 項目すべてを合計すると約 200% になる。
      検算には **好中球** を使い、桿状核球・分葉核球は合計に含めない。
      桿状核球・分葉核球は列としては保持し、
      「桿状核球 + 分葉核球 ≒ 好中球」の整合性検査に別途使う。
  好中球の内訳:
    members: [Band, Seg]
    equals: Neutro
    tolerance: 3
    note: 桿状核球 + 分葉核球 が 好中球 と一致するかの検算。両方が入力されている症例のみ
